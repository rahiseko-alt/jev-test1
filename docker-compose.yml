services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # 保存先を、消えない置き場所に向ける。
      SQLITE_PATH: /app/data/factchecker.db
    volumes:
      - factchecker-data:/app/data

# PostgreSQL を使う場合は、次を有効にして .env に
#   DATABASE_KIND=postgres
#   DATABASE_URL=postgres://factchecker:factchecker@db:5432/factchecker
# を入れてください。
#
#  db:
#    image: postgres:17
#    environment:
#      POSTGRES_USER: factchecker
#      POSTGRES_PASSWORD: factchecker
#      POSTGRES_DB: factchecker
#    volumes:
#      - factchecker-postgres:/var/lib/postgresql/data

volumes:
  factchecker-data:
#  factchecker-postgres:
